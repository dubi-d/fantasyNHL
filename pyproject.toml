[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-nhl"
version = "0.1.0"
description = "CLI tools for analyzing ESPN fantasy NHL leagues"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "espn_api",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fantasy-nhl = "fantasy_nhl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
